<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 440" width="700" height="440">
  <defs>
    <linearGradient id="bg_C" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14" />
      <stop offset="45%" stop-color="#164e63" />
      <stop offset="100%" stop-color="#040609" />
    </linearGradient>
    <radialGradient id="glow_C" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.30" />
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0" />
    </radialGradient>
    <filter id="shadow_C" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#06b6d4" flood-opacity="0.5" />
    </filter>
    <filter id="card_shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Outer Card Frame -->
  <rect width="700" height="440" rx="28" fill="url(#bg_C)" stroke="#334155" stroke-width="2.5"/>
  <circle cx="350" cy="220" r="200" fill="url(#glow_C)" />
  <rect x="22" y="22" width="656" height="396" rx="22" fill="none" stroke="#06b6d4" stroke-width="1.5" stroke-dasharray="10,8" opacity="0.4"/>

  <!-- Top Badge: Pure Category Header -->
  <g transform="translate(350, 60)">
    <rect x="-105" y="-18" width="210" height="36" rx="18" fill="rgba(255,255,255,0.07)" stroke="#06b6d4" stroke-width="1.5" filter="url(#card_shadow)"/>
    <text x="0" y="5" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" fill="#22d3ee" text-anchor="middle" letter-spacing="2.5">REBUS ARENA</text>
  </g>

  <!-- Center Clue Board: Pure Clue Only -->
  <g transform="translate(350, 215)">
    <!-- Clue Banner -->
    <rect x="-295" y="-85" width="590" height="170" rx="24" fill="rgba(10, 14, 24, 0.88)" stroke="#06b6d4" stroke-width="2" filter="url(#card_shadow)"/>
    
    <!-- Subtitle Category Tag -->
    <text x="0" y="-38" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" fill="#22d3ee" text-anchor="middle" letter-spacing="3" opacity="0.8">WORDPLAY PUZZLE</text>
    
    <!-- Big Bold Clue -->
    <text x="0" y="22" font-family="system-ui, -apple-system, 'SF Pro Display', sans-serif" font-size="40" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">Body of Water in Alphabet</text>
  </g>

  <!-- Bottom Mystery Box Tile -->
  <g transform="translate(350, 355)">
    <rect x="-38" y="-28" width="76" height="56" rx="14" fill="rgba(255,255,255,0.06)" stroke="#22d3ee" stroke-width="2" stroke-dasharray="6,4"/>
    <text x="0" y="11" font-family="'Bungee', system-ui, sans-serif" font-size="34" font-weight="900" fill="#22d3ee" text-anchor="middle">?</text>
  </g>
</svg>