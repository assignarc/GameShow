<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="1280" height="800">
  <defs>
    <linearGradient id="bg_673063" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a0b1e" />
      <stop offset="100%" stop-color="#2d1838" />
    </linearGradient>
    <pattern id="grid_673063" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.5" fill="#e879f9" opacity="0.12" />
    </pattern>
  </defs>

  <!-- Card Background -->
  <rect width="800" height="500" rx="20" fill="url(#bg_673063)"/>
  <rect width="800" height="500" rx="20" fill="url(#grid_673063)"/>
  
  <!-- Outer Game Show Golden Border -->
  <rect x="18" y="18" width="764" height="464" rx="16" fill="none" stroke="#582b6b" stroke-width="2.5" stroke-dasharray="8,8"/>
  <rect x="26" y="26" width="748" height="448" rx="12" fill="none" stroke="#e879f9" stroke-width="1.5" opacity="0.3"/>

  <!-- Top Badge: SAY WHAT YOU SEE -->
  <g transform="translate(400, 65)">
    <rect x="-140" y="-18" width="280" height="34" rx="17" fill="#e879f9" opacity="0.15"/>
    <rect x="-140" y="-18" width="280" height="34" rx="17" fill="none" stroke="#e879f9" stroke-width="1.5"/>
    <text y="5" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="900" fill="#e879f9" text-anchor="middle" letter-spacing="2">
      SAY WHAT YOU SEE • REBUS
    </text>
  </g>

  <!-- Main Puzzle Graphic Content -->
  <g transform="translate(400, 245)">
                        <text x="-160" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="68" font-weight="900" fill="#ffffff" text-anchor="middle">1,</text>
                        <rect x="-80" y="-55" width="160" height="90" rx="16" fill="#1c1815" stroke="#e879f9" stroke-width="4" filter="drop-shadow(0 0 15px rgba(245,158,11,0.4))"/>
                        <text x="0" y="14" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="900" fill="#e879f9" text-anchor="middle" letter-spacing="3">ONE</text>
                        <text x="170" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="68" font-weight="900" fill="#ffffff" text-anchor="middle">,000</text>
                    </g>

  <!-- Bottom Puzzle Footer -->
  <text x="400" y="445" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#64748b" text-anchor="middle" letter-spacing="1">
    FALL PARTY REBUS CHAMPIONSHIP
  </text>
</svg>